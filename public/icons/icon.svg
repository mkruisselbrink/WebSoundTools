<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#1e293b" stroke-width="12" />
  <!-- Log Grid Lines -->
  <g stroke="#1e293b" stroke-width="4" opacity="0.8">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" stroke="#334155" stroke-width="5" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="80" x2="128" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="384" y1="80" x2="384" y2="432" />
  </g>
  <!-- Secondary Phase/Ref Trace -->
  <path
    d="M 64 310 C 120 290, 160 180, 220 240 C 280 300, 330 160, 448 210"
    fill="none"
    stroke="#f59e0b"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="16 14"
    opacity="0.85"
  />
  <!-- Primary Transfer Function Magnitude Trace -->
  <path
    d="M 64 260 C 110 260, 140 165, 195 190 C 245 215, 275 310, 325 250 C 375 190, 405 220, 448 245"
    fill="none"
    stroke="url(#trace)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- EQ Node Handle -->
  <circle cx="195" cy="190" r="16" fill="#060911" stroke="#38bdf8" stroke-width="8" />
  <circle cx="325" cy="250" r="16" fill="#060911" stroke="#10b981" stroke-width="8" />
</svg>

